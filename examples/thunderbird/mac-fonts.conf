<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Make the container's apps (Electron/Chromium, e.g. 1Password) render with the
     Mac's system typeface. The CSS/system font names those apps ask for on macOS
     (-apple-system / BlinkMacSystemFont / system-ui) are mapped to Helvetica Neue,
     the Mavericks UI font. The font file itself is NOT shipped here (Apple
     licensing); it is copied from the host at setup (see `op fonts`). Without the
     file present these aliases are harmless no-ops. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Helvetica Neue</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Helvetica Neue</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Helvetica Neue</string></edit>
  </match>
  <!-- Also prefer Helvetica Neue for the generic sans-serif and for system-ui
       (which the latin configs only use as a fallback target, so the <match>
       above doesn't catch it), so unstyled/system text matches the Mac look
       rather than falling to DejaVu. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Helvetica Neue</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Helvetica Neue</family></prefer>
  </alias>
</fontconfig>
