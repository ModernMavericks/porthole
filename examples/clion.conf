# CLion app-specific viewer manifest (shell KEY=value; sourced by bin/generate-viewer).
# Viewer #5 = the contrast case: a JetBrains IDE (Swing/JBR, NOT Electron), installed from
# a TARBALL (not apt), with a deep native menu bar -- exercises the generator's non-apt
# install path and (later) the menu-bar manifest + host-FS project mounts.
APP=CLion
NAME=
SLUG=clion
PORT=10004
BASE_IMAGE=debian:13-slim

# No apt package -- CLion ships as a tarball. Base-distro apt (empty key/repo) just for
# the X11/font libs its bundled Swing/JBR runtime needs to render.
APT_KEY_URL=
APT_REPO=
APT_LIST=
APT_PKGS=
EXTRA_PKGS='fontconfig libfreetype6 libxext6 libxi6 libxrender1 libxtst6 libxrandr2 procps'

# Tarball install: JetBrains "latest CLion for Linux" redirect -> /opt/clion, launcher
# symlinked onto PATH as `clion`. (bundles its own JBR -- no JDK needed.)
TARBALL_URL='https://download.jetbrains.com/product?code=CL&latest&distribution=linux'
TARBALL_BIN=bin/clion.sh
APP_BIN=clion
APP_FLAGS=

USER=clion
# JetBrains settings live under ~/.config/JetBrains. (Caches ~/.cache/JetBrains and
# ~/.local/share are NOT persisted yet -- single-volume limitation; re-index per launch.)
DATADIR=/home/clion/.config/JetBrains
ICON_GLOB=/opt/clion/bin/clion.png

# Lifecycle: ondemand (heavy IDE -> stop the container when the viewer quits).
LIFECYCLE=ondemand

# Bridges. No audio; open-url sends doc/links to the Mac browser. The PROJECT dir is a
# launch-time mount (CLION_MOUNTS="$HOME/code/foo" bin/clion), not baked here.
AUDIO=
PRINTING=
PTRACE=
DARK_THEME=
OPEN_URL=yes
FILE_TRANSFER=yes
NOTIFICATIONS=yes
UPDATE=float
