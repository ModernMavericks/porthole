# Helium browser app-specific viewer manifest (shell KEY=value; sourced by bin/generate-viewer).
# Viewer #4 = the flagship browser (Chromium-based, imputnet/helium). Exercises the audio
# bridge at scale (web video/audio) and many windows/popups.
APP=Helium
NAME=
SLUG=helium
PORT=10003
BASE_IMAGE=debian:13-slim

# Helium ships its own Debian repo. The keyring PATH must match where the Dockerfile
# template writes the dearmored key (/usr/share/keyrings/<SLUG>-desktop-keyring.gpg).
APT_KEY_URL=https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc
APT_REPO='deb [arch=amd64 signed-by=/usr/share/keyrings/helium-desktop-keyring.gpg] https://pkg.helium.computer/deb stable main'
APT_LIST=helium
APT_PKGS=helium-bin

# Chromium-based, but Helium sandboxes via USER NAMESPACES (works under the launcher's
# seccomp=unconfined) -- it does NOT want --no-sandbox (unsupported). No app flags needed.
APP_BIN=helium
APP_FLAGS=

USER=helium
# Chromium fork -> profile lives under the reverse-DNS product name (verified from where
# it writes Default/ + Local State), NOT ~/.config/helium.
DATADIR=/home/helium/.config/net.imput.helium
ICON_GLOB=/usr/share/icons/hicolor/256x256/apps/helium.png

# Host-FS: mount the Mac's Downloads at the browser's download dir, so files you save
# land in your real ~/Downloads. ($HOME = your Mac home, expanded by the launcher.)
HOST_MOUNTS='$HOME/Downloads:/home/helium/Downloads'

# Lifecycle: ondemand (stop the container when the viewer quits) or stayup.
LIFECYCLE=ondemand

# Bridges / capabilities. A browser is the flagship AUDIO test (web video/audio -> Mac).
AUDIO=yes
PRINTING=
PTRACE=
DARK_THEME=
OPEN_URL=yes
FILE_TRANSFER=yes
NOTIFICATIONS=yes
UPDATE=float
