# Thunderbird app-specific viewer manifest (shell KEY=value; sourced by bin/generate-viewer).
# Viewer #3 = the generality test: Gecko/GTK (NOT Electron) and Debian-native (no
# third-party apt repo, no --no-sandbox), so it exercises the template slots Signal doesn't.
APP=Thunderbird
NAME=
SLUG=thunderbird
PORT=10002
BASE_IMAGE=debian:13-slim

# Debian ships Thunderbird in its own repos -> empty APT_KEY_URL => base-distro path
# (no key fetch, no sources.list.d entry). APT_REPO/APT_LIST unused when APT_KEY_URL empty.
APT_KEY_URL=
APT_REPO=
APT_LIST=
APT_PKGS=thunderbird

# GTK app: plain binary, no Electron sandbox flag.
APP_BIN=thunderbird
APP_FLAGS=

# Runtime user + per-user data (Thunderbird's profile lives directly in ~/.thunderbird).
USER=thunderbird
DATADIR=/home/thunderbird/.thunderbird
ICON_GLOB=/usr/share/icons/hicolor/256x256/apps/thunderbird.png

# Lifecycle: ondemand (stop the container when the viewer quits) or stayup.
LIFECYCLE=ondemand

# Bridges / capabilities.
AUDIO=
PRINTING=
PTRACE=
DARK_THEME=
# Live menu bridge: GTK/Gecko exposes AT-SPI menus -> bake the container-side menu
# daemon in. Electron/Swing apps leave this unset -> static menus (structural fallback).
MENU_PRODUCER=atspi
OPEN_URL=yes
FILE_TRANSFER=yes
NOTIFICATIONS=yes
UPDATE=float
