name: release

# Porthole is a Mavericks app that IS its own upstream, so it is versioned by DATE with no
# -mavericks suffix: UPSTREAM_VERSION is the date YYYYMMDD, and a release is YYYYMMDD.N (N counts
# the releases cut that day, starting at .1). push/PR to main build + test only; a manual
# workflow_dispatch cuts + publishes a release stamped with today's next .N. Build -> signed .pkg +
# Sparkle appcast -> the shared publish-release.yml (which mints the tag, checksums, notes body) ->
# refresh the fixed-URL update feed. No 10.9 runner; artifacts re-validated on a real 10.9 box.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# This repo publishes only from a tag or a dispatch, but keeps the family's one shape: eight of the
# thirteen product repos auto-cut on a push to main, and a rule that holds only in some of them is a
# rule nobody can apply from memory.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # Apple Silicon (arm64), cross-targets 10.9; use macos-15 if 26 is unavailable
    # A hang must cost minutes, not the 6-hour default. From 2026-08-04 to 2026-09-09 every run here
    # blocked on the launcher's modal die() dialog and was killed at the 360-minute limit -- three
    # runs per push, ~18 runner-hours, producing nothing and reporting only "cancelled". The dialog
    # is fixed; this is the backstop that makes the NEXT hang cheap and legible instead of silent.
    timeout-minutes: 45
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the .N counter reads existing <date>.* tags

      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        run: |
          set -eu
          base="$(tr -d '[:space:]' < UPSTREAM_VERSION)"   # the date, e.g. 20260802
          # N = 1 + the highest existing <base>.N among the shipped tags (first release of a day = .1).
          maxn=0
          for t in $(git tag --list "$base.*"); do
            n="${t##*.}"
            case "$n" in ''|*[!0-9]*) : ;; *) [ "$n" -gt "$maxn" ] && maxn="$n" ;; esac
          done
          ver="$base.$((maxn + 1))"
          pub=no
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && pub=yes
          printf '%s\n' "$ver" > VERSION
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      # The transport build RUNS what it built (build/check-transport.sh): that is what lets a
      # skalibs/s6 bump ride the green build. Its binaries are x86_64 and this runner is arm64.
      - name: Ensure this runner can run x86_64 (Rosetta)
        run: |
          set -eu
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Build Porthole.app + the Sparkle updater (x86_64 / min-10.9)
        run: |
          set -eu
          cmake -S . -B _build -DPORTHOLE_BUILD_UPDATER=ON
          cmake --build _build --target Porthole
          cmake --build _build --target PortholeUpdater
          cmake --build _build --target transport   # cross-build skalibs+s6 -> _build/engine-bin

      - name: Package the .pkg (Porthole.app + engine CLI + updater + LaunchAgent)
        run: |
          set -eu
          UPD_APP="$PWD/_build/PortholeUpdater.app" \
          PORTHOLE_TRANSPORT_DIR="$PWD/_build/engine-bin" \
            sh packaging/macos/build_pkg.sh "${{ steps.ver.outputs.ver }}" \
               "dist/porthole-${{ steps.ver.outputs.ver }}.pkg" \
               "$PWD/_build/viewer/Porthole.app"

      # Generate the single notes file ONCE, before it has two consumers: the appcast's <description>
      # (next step) and the release body, which travels IN the artifact because publish-release.yml
      # does not check out the repo (dist/RELEASE_NOTES.md is uploaded below with the rest of dist/*).
      # Same bytes, same file, read twice -- so the Release page and Sparkle tell one story.
      - name: Generate release notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          VER="${{ steps.ver.outputs.ver }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "$VER" --version "$VER" \
            --product Porthole --min-os 10.9 --out dist/RELEASE_NOTES.md

      - name: EdDSA-sign the .pkg + generate the Sparkle appcast
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
        run: |
          set -eu
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace can print it
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER="${{ steps.ver.outputs.ver }}"
          PKG="$(ls dist/porthole-*.pkg | head -1)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Porthole" --version "$VER" \
            --pkg-url "$base/$(basename "$PKG")" --notes-file dist/RELEASE_NOTES.md \
            --pkg "$PKG" --min-os 10.9 > dist/appcast.xml
          echo "=== appcast.xml ==="; cat dist/appcast.xml

      - uses: actions/upload-artifact@v7
        with:
          name: porthole
          path: dist/*

  # All-or-nothing publish: the ONLY writer to Releases, gated on the build. The shared workflow
  # regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the body (failing if missing
  # or empty), and mints the tag at this commit (a dispatch-cut tag pushed by GITHUB_TOKEN triggers
  # nothing, so the publisher must mint it inline).
  # The shared BASE container image every viewer FROMs (xpra/Xvfb/runtime/menu-daemon/fonts -- NO
  # vendor software). Built on Linux and pushed to GHCR so users PULL the heavy common layer (shared
  # across all apps) instead of rebuilding it. Tagged with the release version + :latest, matching the
  # BASE_REF generate-viewer pins. First push creates the package PRIVATE -- flip it to PUBLIC once in
  # the org's package settings so users can pull without a GitHub login.
  #
  # This job is the ONLY writer to GHCR, and it runs only on a publishing run -- which is why
  # base-image.yml exists to BUILD the same image (via the same script, no push) on every PR that can
  # change it. Without that, a rotted pin stays invisible until a release dispatch goes red.
  base-image:
    needs: build
    if: needs.build.outputs.publish == 'yes'
    runs-on: ubuntu-latest   # Linux, for `docker build` of the amd64 image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push the shared base
        run: |
          set -eu
          IMG=ghcr.io/modernmavericks/porthole-base
          VER="${{ needs.build.outputs.ver }}"
          # One script assembles the context and reads the XPRA_VERSION pin, so this job and the
          # PR-time base-image.yml build byte-identical instructions.
          sh build/build-base-image.sh "$IMG:$VER" "$IMG:latest"
          docker push "$IMG:$VER"
          docker push "$IMG:latest"
          echo "pushed $IMG:$VER + :latest"

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. shipyard's publish-release.yml looks for this job's record on any signed
  # release; it cannot run the scan itself (reading job logs needs actions: read).
  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')   # a build that fails after signing left logs too; scan them
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: ModernMavericks/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: porthole
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: ModernMavericks/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: porthole

  # The fixed-URL update FEED: Sparkle installs poll it, so it cannot be /latest/. A feed-porthole
  # prerelease holds the appcast; its asset is replaced every release, the tag never moves.
  feed:
    needs: [build, publish]
    if: needs.build.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: porthole
          path: dist
      - name: Point feed-porthole at ${{ needs.build.outputs.ver }}
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          VER: ${{ needs.build.outputs.ver }}
        run: |
          set -eu
          ls dist/appcast.xml >/dev/null   # a feed with no appcast is a broken product
          if ! gh release view "feed-porthole" --repo "$R" >/dev/null 2>&1; then
            gh release create "feed-porthole" --repo "$R" --prerelease --title "Porthole update feed" \
              --notes "Sparkle appcast for Porthole; asset replaced every release, tag never moves."
          fi
          gh release upload "feed-porthole" --repo "$R" dist/appcast.xml --clobber
          echo "feed-porthole now serves $VER"
