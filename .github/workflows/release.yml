name: release

# Porthole is a Mavericks app that IS its own upstream, so it is versioned by DATE with no
# -mavericks suffix: UPSTREAM_VERSION is the date YYYYMMDD, and a release is YYYYMMDD.N (N counts
# the releases cut that day, starting at .1). push/PR to main build + test only; a manual
# workflow_dispatch cuts + publishes a release stamped with today's next .N. Build -> signed .pkg +
# Sparkle appcast -> the shared publish-release.yml (which mints the tag, checksums, notes body) ->
# refresh the fixed-URL update feed. No 10.9 runner; artifacts re-validated on a real 10.9 box.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel a dispatch (it publishes): all dispatches share ONE group -- a version-bump lock, so
# two cannot cut the same .N. A dispatch and an ordinary main build use different groups and never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: macos-26   # Apple Silicon (arm64), cross-targets 10.9; use macos-15 if 26 is unavailable
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the .N counter reads existing <date>.* tags

      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1

      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        run: |
          set -eu
          base="$(tr -d '[:space:]' < UPSTREAM_VERSION)"   # the date, e.g. 20260802
          # N = 1 + the highest existing <base>.N among the shipped tags (first release of a day = .1).
          maxn=0
          for t in $(git tag --list "$base.*"); do
            n="${t##*.}"
            case "$n" in ''|*[!0-9]*) : ;; *) [ "$n" -gt "$maxn" ] && maxn="$n" ;; esac
          done
          ver="$base.$((maxn + 1))"
          pub=no
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && pub=yes
          printf '%s\n' "$ver" > VERSION
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

      - name: Run the repo's tests
        run: sh "$MSC_SCRIPTS/run-repo-tests.sh"

      - name: Build Porthole.app + the Sparkle updater (x86_64 / min-10.9)
        run: |
          set -eu
          cmake -S . -B _build -DPORTHOLE_BUILD_UPDATER=ON
          cmake --build _build --target Porthole
          cmake --build _build --target PortholeUpdater

      - name: Package the .pkg (Porthole.app + engine CLI + updater + LaunchAgent)
        run: |
          set -eu
          UPD_APP="$PWD/_build/PortholeUpdater.app" \
            sh packaging/macos/build_pkg.sh "${{ steps.ver.outputs.ver }}" \
               "dist/porthole-${{ steps.ver.outputs.ver }}.pkg" \
               "$PWD/_build/viewer/Porthole.app"

      - name: EdDSA-sign the .pkg + generate the Sparkle appcast
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
        run: |
          set -eu
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER="${{ steps.ver.outputs.ver }}"
          PKG="$(ls dist/porthole-*.pkg | head -1)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER"
          sh "$MSC_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Porthole" --version "$VER" \
            --pkg-url "$base/$(basename "$PKG")" --notes-file release-notes/README.md \
            --pkg "$PKG" --min-os 10.9 > dist/appcast.xml
          echo "=== appcast.xml ==="; cat dist/appcast.xml

      - name: Collect the release-notes body into the artifact
        run: |
          set -eu
          # The body travels IN the artifact: publish-release.yml does not check out the repo.
          if [ -s release-notes/README.md ]; then cp release-notes/README.md dist/RELEASE_NOTES.md
          else printf '## Porthole %s\n\nAutomated release.\n' "${{ steps.ver.outputs.ver }}" > dist/RELEASE_NOTES.md; fi

      - uses: actions/upload-artifact@v7
        with:
          name: porthole
          path: dist/*

  # All-or-nothing publish: the ONLY writer to Releases, gated on the build. The shared workflow
  # regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the body (failing if missing
  # or empty), and mints the tag at this commit (a dispatch-cut tag pushed by GITHUB_TOKEN triggers
  # nothing, so the publisher must mint it inline).
  # The shared BASE container image every viewer FROMs (xpra/Xvfb/runtime/menu-daemon/fonts -- NO
  # vendor software). Built on Linux and pushed to GHCR so users PULL the heavy common layer (shared
  # across all apps) instead of rebuilding it. Tagged with the release version + :latest, matching the
  # BASE_REF generate-viewer pins. First push creates the package PRIVATE -- flip it to PUBLIC once in
  # the org's package settings so users can pull without a GitHub login.
  base-image:
    needs: build
    if: needs.build.outputs.publish == 'yes'
    runs-on: ubuntu-latest   # Linux, for `docker build` of the amd64 image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the base build context
        run: |
          set -eu
          mkdir -p _basectx
          cp base/Dockerfile          _basectx/Dockerfile
          cp menu-daemon.py           _basectx/porthole-menu-daemon.py
          cp templates/mac-fonts.conf _basectx/mac-fonts.conf
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push the shared base
        run: |
          set -eu
          IMG=ghcr.io/modernmavericks/porthole-base
          VER="${{ needs.build.outputs.ver }}"
          docker build -t "$IMG:$VER" -t "$IMG:latest" _basectx
          docker push "$IMG:$VER"
          docker push "$IMG:latest"
          echo "pushed $IMG:$VER + :latest"

  publish:
    needs: build
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: ModernMavericks/shared-cmake/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: porthole

  # The fixed-URL update FEED: Sparkle installs poll it, so it cannot be /latest/. A feed-porthole
  # prerelease holds the appcast; its asset is replaced every release, the tag never moves.
  feed:
    needs: [build, publish]
    if: needs.build.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: porthole
          path: dist
      - name: Point feed-porthole at ${{ needs.build.outputs.ver }}
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          VER: ${{ needs.build.outputs.ver }}
        run: |
          set -eu
          ls dist/appcast.xml >/dev/null   # a feed with no appcast is a broken product
          if ! gh release view "feed-porthole" --repo "$R" >/dev/null 2>&1; then
            gh release create "feed-porthole" --repo "$R" --prerelease --title "Porthole update feed" \
              --notes "Sparkle appcast for Porthole; asset replaced every release, tag never moves."
          fi
          gh release upload "feed-porthole" --repo "$R" dist/appcast.xml --clobber
          echo "feed-porthole now serves $VER"
