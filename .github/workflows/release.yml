name: release

# Porthole is versioned like mavericks-shared-cmake: plain vX.Y.Z from the committed VERSION file
# (NOT the <upstream>-mavericks.N port scheme -- Porthole ports nothing). Bump VERSION to cut a
# release. On push to main this builds Porthole.app + the Sparkle updater into a signed .pkg and,
# if vX.Y.Z has not been published yet, creates the GitHub Release at tag vX.Y.Z with the pkg +
# appcast, moves the @vMAJOR ingredient tag, and refreshes the update feed. PRs just build + test.
# No 10.9 runner anywhere; artifacts are re-validated on a real 10.9 box out-of-band.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two publishes racing the same tag is a corrupt release, not a flaky build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26   # Apple Silicon (arm64), cross-targets 10.9; use macos-15 if 26 is unavailable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1

      - name: Version + publish decision
        id: ver
        run: |
          set -eu
          ver="$(tr -d '[:space:]' < VERSION)"
          tag="v$ver"; major="v${ver%%.*}"
          pub=no
          if [ "$GITHUB_REF_NAME" = main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag already released -- build only"
            else
              pub=yes
            fi
          fi
          { echo "ver=$ver"; echo "tag=$tag"; echo "major=$major"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver tag=$tag publish=$pub"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run the repo's tests
        run: sh "$MSC_SCRIPTS/run-repo-tests.sh"

      - name: Build Porthole.app + the Sparkle updater (x86_64 / min-10.9)
        run: |
          set -eu
          cmake -S . -B _build -DPORTHOLE_BUILD_UPDATER=ON
          cmake --build _build --target Porthole
          cmake --build _build --target PortholeUpdater

      - name: Package the .pkg (Porthole.app + engine CLI + updater + LaunchAgent)
        run: |
          set -eu
          UPD_APP="$PWD/_build/PortholeUpdater.app" \
            sh packaging/macos/build_pkg.sh "${{ steps.ver.outputs.ver }}" \
               "dist/porthole-${{ steps.ver.outputs.ver }}.pkg" \
               "$PWD/_build/viewer/Porthole.app"

      - name: EdDSA-sign the .pkg + generate the Sparkle appcast
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
        run: |
          set -eu
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER="${{ steps.ver.outputs.ver }}"; TAG="${{ steps.ver.outputs.tag }}"
          PKG="$(ls dist/porthole-*.pkg | head -1)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          sh "$MSC_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Porthole" --version "$VER" \
            --pkg-url "$base/$(basename "$PKG")" --notes-file release-notes/README.md \
            --pkg "$PKG" --min-os 10.9 > dist/appcast.xml
          echo "=== appcast.xml ==="; cat dist/appcast.xml

      - name: Publish the release + move the @vMAJOR ingredient tag + refresh the feed
        if: steps.ver.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          MAJOR: ${{ steps.ver.outputs.major }}
        run: |
          set -eu
          NOTES="release-notes/${TAG}.md"; [ -f "$NOTES" ] || NOTES="release-notes/README.md"
          ( cd dist && shasum -a 256 porthole-*.pkg appcast.xml > SHA256SUMS )
          # gh release create mints the immutable tag $TAG at this commit and attaches the assets.
          gh release create "$TAG" --repo "$R" --target "$GITHUB_SHA" \
            --title "Porthole $TAG" --notes-file "$NOTES" \
            dist/porthole-*.pkg dist/appcast.xml dist/SHA256SUMS
          # Move the @vMAJOR ingredient tag (consumers pin the porthole install action at @vMAJOR).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$MAJOR" -m "$MAJOR -> $TAG" "$GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${R}.git" "$MAJOR"
          # Fixed-URL update feed for Sparkle (its asset is replaced every release; the tag never moves).
          if ! gh release view "feed-porthole" --repo "$R" >/dev/null 2>&1; then
            gh release create "feed-porthole" --repo "$R" --prerelease --title "Porthole update feed" \
              --notes "Sparkle appcast for Porthole; asset replaced every release, tag never moves."
          fi
          gh release upload "feed-porthole" --repo "$R" dist/appcast.xml --clobber
          echo "published $TAG, moved $MAJOR, refreshed feed-porthole"
