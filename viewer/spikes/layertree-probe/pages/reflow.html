<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;font-family:sans-serif}
  /* Fluid columns + wrapping text: every width change re-lays-out and
     repaints the whole flow. */
  #wrap{display:flex;flex-wrap:wrap;gap:12px;padding:12px}
  .card{flex:1 1 240px;min-width:180px;background:#eef;padding:12px;
        will-change:transform}
</style></head><body>
  <div id="wrap"></div>
  <script>
    const w=document.getElementById('wrap');
    const lorem='Lorem ipsum dolor sit amet consectetur adipiscing elit '.repeat(8);
    for(let i=0;i<30;i++){const c=document.createElement('div');
      c.className='card';c.textContent=i+': '+lorem;w.appendChild(c);}
  </script>
</body></html>
