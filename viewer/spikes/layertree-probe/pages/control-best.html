<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;background:#fff}
  /* One promoted layer with static content. The probe translates it via
     Emulation viewport change; content never changes -> geometry-only. */
  #box{position:absolute;top:20px;left:20px;width:300px;height:300px;
       background:linear-gradient(#f80,#08f);will-change:transform}
</style></head><body>
  <div id="box">static</div>
</body></html>
